<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ULTRA-ZOMBIE 10</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font:bold 15px monospace;overflow:hidden;user-select:none}
#c{display:block;width:100vw;height:calc(100vh - 42px);image-rendering:pixelated}
#mm{position:absolute;top:8px;right:8px;width:110px;height:75px;border:2px solid #fff;background:#000}
#sb{position:absolute;top:90px;right:8px;text-align:right;background:rgba(0,0,0,.7);border-right:3px solid #fa0;padding:3px 7px}
#rk{font-size:18px;color:#fa0}
#lg{font-size:10px;color:#0f0}
#ms{position:absolute;top:8px;left:8px;background:rgba(20,0,0,.85);padding:6px 10px;border:2px solid #f00;font-size:12px;max-width:calc(100vw - 130px)}
#cr{position:absolute;top:calc(50% - 21px);left:50%;transform:translate(-50%,-50%);color:#0f0;font-size:20px;pointer-events:none}
#hd{height:42px;background:#1a1a1a;border-top:2px solid #555;display:flex;justify-content:space-around;align-items:center}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:9;padding:15px}
input,button{padding:9px 14px;font-size:15px;margin:4px;font-family:inherit;font-weight:bold}
button{background:#c00;color:#fff;border:2px solid #fff;cursor:pointer}
button:hover{background:#f00}
.sk{display:flex;gap:12px;margin:10px 0}
.sb{border:3px solid #555;background:#222;padding:8px;width:120px;cursor:pointer}
.sb.act{border-color:#0f0;background:#132}
.sb img{width:56px;height:56px;object-fit:contain;background:#fff;display:block;margin:0 auto 5px}
</style>
</head>
<body>
<div id="ov">
  <div id="scr1">
    <h1 style="color:#f00">ULTRA-ZOMBIE: ДО 10 ИГРОКОВ</h1>
    <div class="sk">
      <button type="button" id="s1" class="sb act" onclick="pick(1)"><img src="skin1.png" onerror="this.style.opacity=.2">СКИН 1</button>
      <button type="button" id="s2" class="sb" onclick="pick(2)"><img src="skin2.png" onerror="this.style.opacity=.2">СКИН 2</button>
    </div>
    <input id="cin" placeholder="ВВЕДИ КОД КОМНАТЫ" maxlength="12" style="width:240px;text-align:center;text-transform:uppercase"><br>
    <button type="button" onclick="hostGame()">СОЗДАТЬ КОМНАТУ</button>
    <button type="button" onclick="joinGame()">ВОЙТИ</button>
    <button type="button" onclick="soloGame()" style="background:#444">ОДИН</button>
    <div id="nst" style="color:#fa0;margin-top:8px"></div>
  </div>
  <div id="scr2" style="display:none">
    <h1 style="color:#0f0">ЛОББИ ГОТОВО!</h1>
    <p style="margin:10px 0">КОД: <span id="lcd" style="color:#0cf">-</span> | СКИН: <span id="lsk" style="color:#fa0">СКИН 1</span> | ИГРОКИ: <span id="lpl" style="color:#0f0">1</span>/10</p>
    <p id="lht" style="color:#aaa;font-size:12px;margin-bottom:12px">Нажми «НАЧАТЬ ИГРУ», когда будешь готов</p>
    <button type="button" onclick="startPlay()" style="background:#090;font-size:20px;padding:12px 30px">НАЧАТЬ ИГРУ</button>
  </div>
</div>
<canvas id="c" width="320" height="200"></canvas>
<canvas id="mm" width="60" height="40"></canvas>
<div id="ms"></div>
<div id="cr">+</div>
<div id="sb"><div id="rk">D</div><div id="lg"></div></div>
<div id="hd">
  <div style="color:#f33">HP:<span id="hp">100</span></div>
  <div style="color:#0cf">КОД:<span id="rm">-</span></div>
  <div style="color:#0f0">ИГРОКИ:<span id="pl">1</span>/10</div>
  <div>ВРАГИ:<span id="en">0</span></div>
  <div>ЭТАП:<span id="st">1</span>/50</div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const mx2=document.getElementById('mm').getContext('2d');
const ov=document.getElementById('ov'),nst=document.getElementById('nst');
const sp={},k={};
let mySkin='skin1',myId='p'+Math.random().toString(36).slice(2,7);
let peer=null,conns=new Map(),isHost=1,roomCode='-',mates=new Map(),ac=null;

function pick(n){
  mySkin='skin'+n;
  document.getElementById('s1').className='sb'+(n==1?' act':'');
  document.getElementById('s2').className='sb'+(n==2?' act':'');
  document.getElementById('lsk').innerText='СКИН '+n;
}
function safeId(r){
  return Array.from(r.trim().toUpperCase()).map(ch=>/[A-Z0-9_-]/.test(ch)?ch:ch.charCodeAt(0).toString(16)).join('').slice(0,24);
}
function sfx(a,b,d,t='sawtooth'){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state=='suspended')ac.resume();
    if(ac.state!='running')return;
    const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=t;o.frequency.setValueAtTime(a,n);o.frequency.exponentialRampToValueAtTime(b,n+d);
    g.gain.setValueAtTime(.13,n);g.gain.exponentialRampToValueAtTime(.01,n+d);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d);
  }catch(e){}
}
function clean(im){
  const f=document.createElement('canvas'),w=im.width||64,h=im.height||64;
  f.width=w;f.height=h;const g=f.getContext('2d');g.drawImage(im,0,0);
  try{
    const id=g.getImageData(0,0,w,h),d=id.data,vis=new Uint8Array(w*h),q=new Array();
    for(let i=0;i<w;i++){q.push(i);q.push((h-1)*w+i);}
    for(let j=0;j<h;j++){q.push(j*w);q.push(j*w+w-1);}
    while(q.length){
      const idx=q.pop();
      if(vis.subarray(idx,idx+1).join('')=='1')continue;
      vis.fill(1,idx,idx+1);const p4=idx*4;
      if(d.subarray(p4,p4+1).join('')>230&&d.subarray(p4+1,p4+2).join('')>230&&d.subarray(p4+2,p4+3).join('')>230){
        d.fill(0,p4+3,p4+4);const xx=idx%w,yy=(idx/w)|0;
        if(xx>0)q.push(idx-1);if(xx<w-1)q.push(idx+1);
        if(yy>0)q.push(idx-w);if(yy<h-1)q.push(idx+w);
      }
    }
    g.putImageData(id,0,0);
  }catch(e){}
  return f;
}
function fb(n){
  const f=document.createElement('canvas');f.width=f.height=32;const g=f.getContext('2d');
  g.fillStyle=n=='zombie'?'#4a2':n=='solider'?'#092':n=='skin1'?'#f80':n=='skin2'?'#ea5':n=='трассер'?'#fa0':'#444';
  g.fillRect(8,4,16,24);return f;
}
new Array('zombie','solider','skin1','skin2','gun','трассер').forEach(n=>{
  sp[n]=fb(n);const m=new Image();m.onload=()=>sp[n]=clean(m);m.src=n+'.png';
});
const W=60,H=40;
function cell(xx,yy){
  if(yy<=0||yy>=H-1||xx<=0||xx>=W-1)return 1;
  if(xx%8>=2&&xx%8<=6&&yy%8>=2&&yy%8<=6){
    if((xx+yy)%9==0)return 2;
    const m=(Math.floor(xx/8)+Math.floor(yy/8))%3;
    return m==0?1:m==1?4:5;
  }
  return 0;
}
const roads=new Array();
for(let y=2;y<H-2;y++)for(let xx=2;xx<W-2;xx++)if(!cell(xx,y))roads.push({x:xx+.5,y:y+.5});
let p={x:15.5,y:15.5,d:0,hp:100,sh:0,z:0,vz:0},st=1,ens=new Array(),bs=new Array();
let rc=0,run=0,hc=0,hf=0,pts=0,lg='',inLobby=0,tick=0;
</script>
<script>
function addS(v,t){
  pts=Math.min(700,pts+v);
  lg=t+'<br>'+lg.split('<br>').shift();
  document.getElementById('lg').innerHTML=lg;
}
function spw(n,hp,t,cd=0){
  const v=roads.filter(r=>Math.hypot(r.x-p.x,r.y-p.y)>6);
  for(let i=0;i<n&&v.length;i++){
    const idx=Math.floor(Math.random()*v.length),s=v.splice(idx,1).pop();
    ens.push({x:s.x,y:s.y,hp,max:hp,t,cd,boss:0});
  }
}
function set(s){
  st=s;document.getElementById('st').innerText=st;ens=new Array();bs=new Array();
  if(s>1)sfx(440,880,.35,'square');
  if(s<50){
    document.getElementById('ms').innerText='ЭТАП '+s+'/50 — Зачисти город! (WASD, Q/E/Мышь, SPACE-прыжок, SHIFT-рывок, ЛКМ/F-огонь)';
    ens.push({x:22.5,y:15.5,hp:60+s*2,max:60+s*2,t:'zombie',cd:0,boss:0});
    spw(Math.min(35,5+s),60+s*2,'zombie');
  }else{
    document.getElementById('ms').innerText='ФИНАЛЬНЫЙ БОССФАЙТ (ЭТАП 50/50): УНИЧТОЖЬ ГИГАНТСКОГО SOLIDER!';
    ens.push({x:24.5,y:15.5,hp:4000,max:4000,t:'solider',cd:25,boss:1});
    spw(8,90,'zombie');
  }
}
function openLobby(cd){
  inLobby=1;roomCode=cd;
  document.getElementById('rm').innerText=cd;
  document.getElementById('lcd').innerText=cd;
  document.getElementById('scr1').style.display='none';
  document.getElementById('scr2').style.display='block';
  if(!isHost)document.getElementById('lht').innerText='Вы вошли в комнату! Нажмите НАЧАТЬ ИГРУ';
}
function startPlay(){
  if(run)return;
  inLobby=0;ov.style.display='none';run=1;
  if(isHost){set(1);sendAll({tp:'go'});}
  loop();
}
function soloGame(){isHost=1;openLobby('ОДИН');}
function hostGame(){
  const raw=document.getElementById('cin').value.trim()||String(1000+Math.floor(Math.random()*9000));
  const sid=safeId(raw);isHost=1;openLobby(raw.toUpperCase());
  if(typeof Peer=='undefined'){document.getElementById('lht').innerText='Оффлайн режим (можно играть одному)';return;}
  if(peer)peer.destroy();
  peer=new Peer('uz3-'+sid);
  peer.on('error',err=>{document.getElementById('lht').innerText='Сеть: '+err.type;});
  peer.on('connection',cn=>{
    if(conns.size>=9){cn.on('open',()=>{cn.send({tp:'full'});cn.close();});return;}
    setupConn(cn);
  });
}
function joinGame(){
  if(typeof Peer=='undefined'){nst.innerText='Сервер сети недоступен. Нажми ОДИН.';return;}
  const raw=document.getElementById('cin').value.trim();
  if(!raw){nst.innerText='Введи код комнаты друга!';return;}
  const sid=safeId(raw);isHost=0;nst.innerText='Подключаемся к '+raw.toUpperCase()+'...';
  if(peer)peer.destroy();
  peer=new Peer();
  peer.on('open',()=>{
    const cn=peer.connect('uz3-'+sid,{reliable:true});
    setupConn(cn);
    cn.on('open',()=>{
      cn.send({tp:'p',id:myId,x:p.x,y:p.y,hp:p.hp,sk:mySkin});
      openLobby(raw.toUpperCase());
    });
    setTimeout(()=>{if(!inLobby&&!run)nst.innerText='Комната '+raw.toUpperCase()+' не найдена!';},4500);
  });
  peer.on('error',err=>{nst.innerText='Ошибка: '+err.type;});
}
function sendAll(m,skip){conns.forEach((cn,id)=>{if(cn.open&&id!=skip)cn.send(m);});}
function setupConn(cn){
  cn.on('open',()=>{
    conns.set(cn.peer,cn);
    document.getElementById('lpl').innerText=1+conns.size;
    if(isHost&&run)cn.send({tp:'go'});
  });
  cn.on('close',()=>{
    conns.delete(cn.peer);mates.delete(cn.peer);
    document.getElementById('lpl').innerText=1+conns.size;
  });
  cn.on('data',d=>{
    if(d.tp=='full'){alert('Комната полная (макс. 10)!');location.reload();return;}
    if(d.tp=='go'&&!isHost)startPlay();
    if(d.tp=='p'){
      mates.set(d.id,{x:d.x,y:d.y,hp:d.hp,sk:d.sk,t:Date.now()});
      document.getElementById('lpl').innerText=1+mates.size;
      if(isHost)sendAll(d,cn.peer);
    }
    if(d.tp=='f'){bs.push({x:d.x,y:d.y,vx:d.vx,vy:d.vy,fp:1});if(isHost)sendAll(d,cn.peer);}
    if(d.tp=='sync'&&!isHost){
      st=d.st;document.getElementById('st').innerText=st;ens=d.ens;
      document.getElementById('ms').innerText=st<50?'ЭТАП '+st+'/50':'ФИНАЛЬНЫЙ БОССФАЙТ (ЭТАП 50/50)!';
      if(d.win)showEnd(1);
    }
    if(d.tp=='hit'&&isHost){let idx=0;ens.forEach(e=>{if(idx++==d.i)e.hp-=d.dmg;});}
  });
}
</script>
<script>
function showEnd(win){
  run=0;document.exitPointerLock();sfx(win?550:110,win?990:40,.5,'square');
  ov.innerHTML=win?'<h1 style="color:#0f0">ПОБЕДА! ВЫ ПРОШЛИ ВСЕ 50 ЭТАПОВ!</h1><p>Гигантский зомби-солдат Solider повержен в финальном боссфайте!</p><button onclick="location.reload()">СНОВА</button>':'<h1 style="color:#f00">ВЫ ПОГИБЛИ НА ЭТАПЕ '+st+'</h1><button onclick="location.reload()">ЗАНОВО</button>';
  ov.style.display='flex';
}
function fire(){
  if(!run||rc>0)return;
  rc=7;sfx(580,80,.1);
  const b={tp:'f',x:p.x+Math.cos(p.d)*.5,y:p.y+Math.sin(p.d)*.5,vx:Math.cos(p.d)*.22,vy:Math.sin(p.d)*.22,fp:1,air:p.z>5,dsh:p.sh>0};
  bs.push(b);sendAll(b);
}
onkeydown=e=>{
  k[e.code]=1;if(e.code=='KeyF')fire();
  if(e.code=='Space'&&!p.z&&run){e.preventDefault();p.vz=5.5;sfx(150,380,.12,'sine');}
  if(e.code.includes('Shift')&&p.sh<=0&&run){p.sh=11;sfx(200,650,.14,'triangle');}
};
onkeyup=e=>k[e.code]=0;
c.onmousedown=()=>{if(document.pointerLockElement!==c)try{c.requestPointerLock();}catch(e){}fire();};
onmousemove=e=>{if(document.pointerLockElement===c)p.d+=e.movementX*.0035;};

function loop(){
  if(!run)return;
  tick++;if(p.sh>0)p.sh--;if(rc>0)rc--;if(hc>0)hc--;if(hf>0)hf--;pts=Math.max(0,pts-.15);
  if(p.z>0||p.vz){p.z+=p.vz;p.vz-=.45;if(p.z<=0)p.z=p.vz=0;}
  let sp0=p.sh>0?.22:.085;
  if(k.KeyQ||k.ArrowLeft)p.d-=.045;
  if(k.KeyE||k.ArrowRight)p.d+=.045;
  let mx=0,my=0;
  if(k.KeyW||k.ArrowUp){mx+=Math.cos(p.d)*sp0;my+=Math.sin(p.d)*sp0;}
  if(k.KeyS||k.ArrowDown){mx-=Math.cos(p.d)*sp0;my-=Math.sin(p.d)*sp0;}
  if(k.KeyA){mx+=Math.sin(p.d)*sp0;my-=Math.cos(p.d)*sp0;}
  if(k.KeyD){mx-=Math.sin(p.d)*sp0;my+=Math.cos(p.d)*sp0;}
  if(!cell((p.x+mx)|0,p.y|0))p.x+=mx;
  if(!cell(p.x|0,(p.y+my)|0))p.y+=my;

  const now=Date.now();mates.forEach((m,id)=>{if(now-m.t>6000)mates.delete(id);});
  let cnt=0;
  ens.forEach(e=>{
    if(e.hp<=0)return;
    cnt++;if(!isHost)return;
    let tx=p.x,ty=p.y,d=Math.hypot(p.x-e.x,p.y-e.y);
    mates.forEach(m=>{if(m.hp>0){const md=Math.hypot(m.x-e.x,m.y-e.y);if(md<d){tx=m.x;ty=m.y;d=md;}}});
    if(d<25){
      let sd=e.boss?4.5:1.5,spd=e.boss?.048:.038;
      if(d>sd){
        let vx=(tx-e.x)/d*spd,vy=(ty-e.y)/d*spd;
        if(!cell((e.x+vx)|0,e.y|0))e.x+=vx;
        if(!cell(e.x|0,(e.y+vy)|0))e.y+=vy;
      }
      if(e.boss&&--e.cd<=0&&d<16){
        e.cd=26;let a=Math.atan2(ty-e.y,tx-e.x);
        bs.push({x:e.x,y:e.y,vx:Math.cos(a)*.18,vy:Math.sin(a)*.18,fp:0});
      }
    }
  });
  ens.forEach(e=>{
    if(e.hp>0&&Math.hypot(p.x-e.x,p.y-e.y)<(e.boss?2.2:1.7)&&p.z<12){
      p.hp-=e.boss?.8:.45;hf=6;if(hc<=0){sfx(110,45,.18);hc=25;}
    }
  });
  bs.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(cell(b.x|0,b.y|0)){b.dead=1;return;}
    if(b.fp){
      ens.forEach((e,idx)=>{
        let rad=e.boss?1.4:.75;
        if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<rad){
          b.dead=1;sfx(180,40,.08,'square');
          if(isHost){
            e.hp-=35;
            if(e.hp<=0){
              addS(b.air?120:b.dsh?100:60,b.air?'+AIRSHOT':b.dsh?'+DASH KILL':'+KILL');
              if(Math.hypot(p.x-e.x,p.y-e.y)<3.5){p.hp=Math.min(100,p.hp+15);addS(50,'+BLOOD HEAL');}
            }
          }else sendAll({tp:'hit',i:idx,dmg:35});
        }
      });
    }else if(Math.hypot(p.x-b.x,p.y-b.y)<.65&&p.sh<=0&&p.z<10){
      p.hp-=22;b.dead=1;hf=8;sfx(110,45,.18);
    }
  });
  bs=bs.filter(b=>!b.dead);

  if(tick%2==0){
    sendAll({tp:'p',id:myId,x:p.x,y:p.y,hp:p.hp,sk:mySkin});
    if(isHost)sendAll({tp:'sync',st:st,ens:ens,win:0});
  }
  document.getElementById('hp').innerText=Math.max(0,p.hp|0);
  document.getElementById('en').innerText=cnt;
  document.getElementById('pl').innerText=1+mates.size;
  const rkList=new Array('D','C','B','A','S','SS','SSS','ULTRAKILL');
  document.getElementById('rk').innerText=rkList.slice(Math.min(7,Math.floor(pts/85))).shift();
  if(p.hp<=0){showEnd(0);return;}
  if(isHost&&!cnt){
    if(st<50){p.hp=Math.min(100,p.hp+25);set(st+1);}
    else{sendAll({tp:'sync',st:50,ens:[],win:1});showEnd(1);return;}
  }

  const hz=100+p.z;
  x.fillStyle='#3b1c1c';x.fillRect(0,0,320,hz);
  x.fillStyle='#484850';x.fillRect(0,hz,320,200-hz);
  const zb=new Array();
  for(let i=0;i<80;i++){
    let ra=p.d-.52+(i/80)*1.04,d=0,h=0;
    while(!h&&d<26){d+=.07;h=cell((p.x+Math.cos(ra)*d)|0,(p.y+Math.sin(ra)*d)|0);}
    d*=Math.cos(ra-p.d);zb.push(d);
    let wh=Math.min(280,200/d),sh=Math.max(50,250-d*8),yt=hz-wh/2+(p.z/d);
    x.fillStyle=h==1?`rgb(${sh*.85},${sh*.25},${sh*.2})`:h==2?`rgb(${sh*.8},${sh*.35},${sh*.3})`:h==4?`rgb(${sh*.9},${sh*.8},${sh*.2})`:`rgb(${sh*.55},${sh*.55},${sh*.6})`;
    if(h==2){x.fillRect(i*4,yt,4,wh*.3);x.fillRect(i*4,yt+wh*.7,4,wh*.3);}
    else x.fillRect(i*4,yt,4,wh);
  }
  let objs=new Array();
  ens.forEach(e=>{if(e.hp>0)objs.push({x:e.x,y:e.y,t:e.t,boss:e.boss,hp:e.hp,max:e.max,d:Math.hypot(e.x-p.x,e.y-p.y)});});
  mates.forEach(m=>{if(m.hp>0)objs.push({x:m.x,y:m.y,t:m.sk,d:Math.hypot(m.x-p.x,m.y-p.y)});});
  bs.forEach(b=>objs.push({x:b.x,y:b.y,t:'трассер',d:Math.hypot(b.x-p.x,b.y-p.y)}));
  objs.sort((a,b)=>b.d-a.d);

  objs.forEach(o=>{
    let ang=Math.atan2(o.y-p.y,o.x-p.x)-p.d;
    while(ang<-Math.PI)ang+=Math.PI*2;
    while(ang>Math.PI)ang-=Math.PI*2;
    if(Math.abs(ang)<.85&&o.d>.1){
      let sx=(ang/1.04+.5)*320,col=Math.floor(sx/4);
      if(col>=0&&col<80&&zb.slice(col,col+1).shift()>o.d){
        let mult=o.boss?1.7:o.t=='трассер'?.55:1,sz=Math.min(260,(175/o.d)*mult),yc=hz+(p.z/o.d);
        x.drawImage(sp[o.t],sx-sz/2,yc-sz/2,sz,sz);
        if(o.boss){
          x.fillStyle='#000';x.fillRect(sx-35,yc-sz/2-12,70,7);
          x.fillStyle='#0f0';x.fillRect(sx-35,yc-sz/2-12,70*(o.hp/o.max),7);
        }
      }
    }
  });
  x.drawImage(sp.gun,130,118+rc*2.5,85,85);
  if(hf>0){x.fillStyle=`rgba(255,0,0,${hf*.05})`;x.fillRect(0,0,320,200);}
  mx2.fillStyle='#111';mx2.fillRect(0,0,W,H);
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++)if(cell(xx,yy)){mx2.fillStyle='#555';mx2.fillRect(xx,yy,1,1);}
  ens.forEach(e=>{if(e.hp>0){mx2.fillStyle=e.boss?'#f0f':'#f00';mx2.fillRect(e.x|0,e.y|0,e.boss?3:1.5,e.boss?3:1.5);}});
  mates.forEach(m=>{if(m.hp>0){mx2.fillStyle='#0af';mx2.fillRect(m.x|0,m.y|0,2,2);}});
  mx2.fillStyle='#0f0';mx2.fillRect(p.x|0,p.y|0,2,2);
  requestAnimationFrame(loop);
}
</script>
